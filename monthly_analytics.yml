name: Monthly Analytics Report

on:
  # Runs at 08:00 UTC on the 1st of every month
  schedule:
    - cron: "0 8 1 * *"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      month:
        description: "Month label (e.g. 2025-05). Defaults to current month."
        required: false

jobs:
  run-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Put your CSV/Excel files in the repo under ./data/
      # Or add a step here to download them from S3, GCS, etc.

      - name: Run analytics bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MONTH="${{ github.event.inputs.month || '' }}"
          if [ -n "$MONTH" ]; then
            python analytics_bot.py --month "$MONTH"
          else
            python analytics_bot.py
          fi

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-report-${{ github.run_id }}
          path: reports/
          retention-days: 90

      # Optional: commit the report back to the repo
      - name: Commit report to repo
        run: |
          git config user.name "Analytics Bot"
          git config user.email "bot@github-actions"
          git add reports/
          git diff --staged --quiet || git commit -m "📊 Monthly analytics report $(date +'%Y-%m')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

